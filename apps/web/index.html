<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050a06" />
    <title>Manufactory Idle</title>
    <!-- U-1g: the default theme's faces, so the first paint isn't a fallback flash. Vite hashes
         the href, the same asset fonts.css's url() resolves to. -->
    <link
      rel="preload"
      href="/src/styles/fonts/vt323-latin-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/src/styles/fonts/ibm-plex-mono-latin-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- V-6: the stored theme before first paint, migrated as theme.ts's migrateTheme does
         (theme.test.ts runs this against its table). Locks aren't known yet: a locked theme
         paints as terminal, and main.tsx applies the capability-aware result. L-16: the CRT
         setting too, as theme.ts's applyCrt does: only "off" is off. -->
    <script>
      (function () {
        var t = null;
        var c = null;
        try {
          t = localStorage.getItem("mi.theme");
          c = localStorage.getItem("mi.crt");
        } catch (e) {}
        if (c === "off") document.documentElement.setAttribute("data-crt", "off");
        if (t === "dark") t = "clean-dark";
        else if (t === "light") t = "clean-light";
        var free = ["terminal", "clean-dark", "clean-oled", "clean-light"];
        if (free.indexOf(t) < 0) t = "terminal";
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
