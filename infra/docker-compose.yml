name: manufactory-idle

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: manufactory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
      POSTGRES_DB: manufactory
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manufactory -d manufactory"]
      interval: 5s
      timeout: 5s
      retries: 12

  supertokens:
    # Pinned to a core whose coreDriverInterfaceSupported.json lists CDI 5.4, the only CDI
    # supertokens-node 24.0.3 supports (its lib/build/version.js). Core 12.3.1 supports
    # CDI 2.7-5.7. Re-check both lists when bumping either side.
    image: registry.supertokens.io/supertokens/supertokens-postgresql:12.3.1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRESQL_CONNECTION_URI: postgresql://manufactory:${POSTGRES_PASSWORD}@postgres:5432/supertokens
      API_KEYS: ${SUPERTOKENS_API_KEY:?set SUPERTOKENS_API_KEY in infra/.env}
    ports:
      - "127.0.0.1:3567:3567"

volumes:
  pgdata:
