name: CI

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  # The pacing gate is ~15 minutes, so it also runs nightly: a content change that
  # lands green on a shallow smoke run still gets measured to tier 10 within a day.
  schedule:
    - cron: "0 5 * * *"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm content:check
      # Spec E.5's gate, shallow: greedy to tier 4 against its pacing targets, plus
      # dead time, the r_eff floor and determinism. ~3 seconds, so it belongs on every
      # commit. The deep form is the `pacing` job.
      - run: pnpm --filter @manufactory/sim run gate:smoke

  # A separate job so it runs ALONGSIDE `check` rather than after it: the two together
  # are ~15 and ~11 minutes, and serialising them would put a 26-minute wall in front of
  # every pull request.
  pacing:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # All three of spec E.5's policies to tier 10. Fails on a tier time outside
      # tolerance, a known-red pin that has drifted OR gone stale, dead time over
      # threshold, an observed r_eff at the runaway floor, or a determinism divergence.
      - run: pnpm --filter @manufactory/sim run gate
