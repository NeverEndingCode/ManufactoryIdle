# Spec B.2/C.0: the purchase ladder is scoped to (lane, class, mark) and marks are
# mark-weighted, so a class used in several lanes pools separately per lane.
#
# Every costRatio here sits above the runaway floor (check 8): with the default
# ladder, m = 1.5^(1/10) = 1.0414, so costRatio 1.09 gives r_eff 1.047 and 1.12
# gives 1.076. Nothing is authored near the knife edge.
#
# Build costs are denominated in items reachable at the mark's own unlock tier --
# check 7's bootstrap analysis proves that rather than trusting the ordering.
machineClasses:
  - id: miner
    name: Miner
    ladder: { step: 1.5, interval: 10 }
    costRatio: 1.09
    marks:
      - { mark: 1, name: Miner Mk.1, rateMultiplier: 1,   buildCostMultiplier: 1,   powerDraw: 5,  buildCost: [{ item: iron_ore, amount: 15 }], unlockTier: 0 }
      - { mark: 2, name: Miner Mk.2, rateMultiplier: 2,   buildCostMultiplier: 3,   powerDraw: 12, buildCost: [{ item: iron_plate, amount: 50 }], unlockTier: 3 }
      - { mark: 3, name: Miner Mk.3, rateMultiplier: 4,   buildCostMultiplier: 9,   powerDraw: 30, buildCost: [{ item: modular_frame, amount: 20 }], unlockTier: 6 }

  - id: smelter
