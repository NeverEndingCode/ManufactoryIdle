# Spec B.7. Pacing intent is authored in COLLECTIONS, not hours: with an 8h offline
# cap a player gets ~3 meaningful collections a day, so a tier costing 40 collections
# is a two-week tier no matter what an hour count claims.
#
# These ten targets are the input to calibration; the milestone amounts and curves are
# its output. Authoring runs in that direction and never the reverse.
pacing:
  targetCollectionsToTier: [2, 5, 11, 24, 52, 110, 230, 480, 1000, 2100]
  activeHoursPerDay: 2.5
  offlineCollectionsPerDay: 3
  purchaseIntervalEarlySeconds: 120
  purchaseIntervalLateSeconds: 1800
  storageBindingCadence: 12
